# PostgreSQL版
services:
  db:
    image: postgres:16
    container_name: philo-db
    environment:
      POSTGRES_DB: philocompass
      POSTGRES_USER: philocompass_user
      POSTGRES_PASSWORD: strongpassword
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U philocompass_user -d philocompass"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  app:
    build: .
    container_name: philo-app
    env_file:
      - .env.development
    environment:
      # .envファイルの値を上書きする場合はここに記述
      DB_HOST: db  # Dockerコンテナ内ではサービス名を使用
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  db-data:

